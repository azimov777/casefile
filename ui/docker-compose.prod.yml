# Продакшен-запуск интерфейса рядом с прод-контуром бэкенда (`../tracker/docker-compose.prod.yml`).
#
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
#
# Наружу смотрит только интерфейс: `/api` проксирует nginx внутрь, поэтому токен едет
# заголовком на свой же источник, браузеру не нужен CORS, а адрес бэкенда не попадает
# в собранную статику. Тот же приём, что и в контуре сквозных тестов, — разница лишь
# в том, куда указывает `TRACKER_API_URL`.

name: tracker-ui-prod

# Настройки этой машины лежат в `.env` рядом — его читает compose на хосте, и внутрь
# образа он не попадает. Образец с объяснениями: `.env.example`. Без файла подъём
# упадёт на несуществующей сети, и это лучше, чем подняться мимо бэкенда.

services:
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tracker-ui:latest
    environment:
      # Куда проксировать `/api`. Умолчание — сервис `api` прод-контура бэкенда, если
      # интерфейс подключён к его сети (см. `networks` ниже). Свой бэкенд задаётся
      # переменной окружения при запуске, без пересборки образа.
      TRACKER_API_URL: ${TRACKER_API_URL:-http://api:8000}
      # Ключ установки, который интерфейс отдаст браузеру конфигурацией на своём
      # источнике: его кладёт при старте контейнера `docker/config-json.sh`. Значение
      # читает с хоста `scripts/up.sh` — из файла, выпущенного командой `local-token`
      # бэкенда; путь к файлу называет `.env`, сам секрет туда не попадает.
      #
      # Пустая переменная законна и означает установку, где людей несколько: конфигурации
      # нет, и каждый входит своим ключом через экран входа. Ровно это и получает тот,
      # кто поднимает контур руками, без скрипта.
      TRACKER_UI_TOKEN: ${TRACKER_UI_TOKEN:-}
    ports:
      # Только петля, и это не перестраховка: с ключом от установки этот порт раздаёт
      # рабочий ключ набора `task` всякому, кто его открыл, — то есть полный доступ ко
      # всему трекеру для любого соседа по сети. Кому нужен интерфейс для нескольких
      # людей, тот поднимает контур без ключа (README, «Интерфейс для нескольких людей»)
      # и открывает порт сам.
      - '127.0.0.1:${UI_PORT:-8080}:80'
    healthcheck:
      # Именно 127.0.0.1: nginx слушает только IPv4, а `localhost` в контейнере
      # разрешается сначала в ::1 и проверка получала бы отказ соединения.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

# Сеть контура бэкенда, поднятого соседним репозиторием: интерфейс приходит в неё
# гостем, а не поднимает свою копию бэкенда. Имя складывается из имени проекта compose
# и имени сети по умолчанию: прод-контур бэкенда даёт `tracker-prod_default`,
# дев-контур — `tracker_default`.
#
# Умолчание оставлено, но полагаться на него нельзя: какой контур бэкенда поднят на
# машине, файл в репозитории не знает. Настоящее значение живёт в `.env` (образец —
# `.env.example`), и без него сборка пройдёт, а подключение упадёт отдельно
# (`docs/notes/tooling.md`).
networks:
  backend:
    external: true
    name: ${TRACKER_NETWORK:-tracker-prod_default}
