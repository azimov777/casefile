<html lang="ru">

    <title>Трекер</title>
    <!--
      Fira Sans набирает подписи, Fira Code — идентификаторы контракта. Обе с
      кириллицей. `display=swap`: контур сквозных тестов поднимается без интернета,
      и страница обязана быть читаемой запасной гарнитурой, а не ждать букв.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400..600&family=Fira+Sans:wght@400;500;600&display=swap"
    />
