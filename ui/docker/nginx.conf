server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Одностраничное приложение: любой путь, кроме файла, отдаёт index.html —
    # иначе перезагрузка на /tasks вернула бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API проксируется на свой источник намеренно: так токен едет только заголовком,
    # браузеру не нужен CORS, а адрес бэкенда не попадает в собранную статику.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Живой поток журнала (задача 07) — SSE: буферизация и таймаут его бы порвали.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
