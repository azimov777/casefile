# Контур для сборки и сквозных тестов: интерфейс из `ui/` и бэкенд из корня
# репозитория. Поднимается одной командой: docker compose up -d --wait
#
# Наружу публикуется только интерфейс. Бэкенд и база видны лишь внутри сети compose:
# рабочий контур трекера (`../docker-compose.yml`) держит 8000, 8100 и 5432
# постоянно, и второй набор тех же портов просто не поднялся бы. Заодно это ровно тот
# способ, которым интерфейс работает в проде: `/api` проксирует nginx на свой источник.
#
# Разовые сервисы спрятаны за профилем `tools`: они не должны стартовать вместе с UI.

name: tracker-ui

x-backend: &backend
  build:
    context: ..
    dockerfile: docker/Dockerfile.dev
  image: tracker-ui-backend:latest
  environment:
    TRACKER_ENVIRONMENT: local
    TRACKER_DEBUG: 'true'
    TRACKER_DATABASE_URL: postgresql+asyncpg://tracker:tracker@db:5432/tracker
    # Адрес MCP, который API сообщает интерфейсу (`GET /api/v1/installation`). MCP этот
    # контур не поднимает, и без настройки адресом было бы умолчание
    # `http://localhost:8100/mcp` — порт рабочей установки машины. Здесь адрес нарочно
    # ни на что не похож: сценарий, сверяющий фрагменты подключения с ответом установки
    # (`e2e/connect.spec.ts`), отличит его от зашитого в код умолчания, а агент, по ошибке
    # подключённый с экрана контура, не уйдёт в чужую установку — домен `.test`
    # не разрешается нигде.
    TRACKER_MCP_PUBLIC_URL: http://mcp.casefile.test:18100/e2e-mcp
    # Пароль владельца контура — фраза `E2E_PASSWORD` из `e2e/contour.ts`, хеш напечатан
    # командой `python -m app.cli password-hash`. Секрета здесь нет: контур учебный.
    #
    # Пароль знает API, а спрашивает его только второй экземпляр интерфейса — одноразовый
    # контейнер службы `ui` в режиме пароля, который поднимает `e2e/global-setup.ts`.
    # Сама служба `ui` ниже остаётся локальной установкой: ключ без входа, и все
    # остальные сценарии видят ровно то, что видит человек на своей машине. Отдельной
    # службой второй экземпляр не заведён намеренно: тег образа соседние деревья
    # подменяют дополнением к `ui`, а службу, которой оно не знает, собрали бы под общим
    # тегом (`docs/notes/testing.md`).
    TRACKER_PASSWORD_HASH: scrypt:32768:8:3:xwuxdvEw-i5O3uOc8nLBDg:wwifPZjmvEw4m4SEs1YeNa4ITHTC2CuTnG9z1i-dIbM
    # Адрес клиента для окна попыток входа API берёт из `X-Real-IP` только от службы `ui`
    # — как в установке (`../docker-compose.prod.yml`). Второй экземпляр интерфейса,
    # в режиме пароля, `e2e/global-setup.ts` поднимает с именем службы (`--use-aliases`),
    # и вход в сценариях идёт тем же путём, что у владельца.
    TRACKER_REAL_IP_FROM: ui
  volumes:
    # Образ разработки бэкенда несёт только зависимости в /opt/venv (TRK-66), код
    # приезжает томом — так же, как в его собственном контуре. Внутрь этого тома
    # больше ничего не монтируется: анонимный `/app/.venv` заводил пустой каталог
    # на машине хозяина и был снят (UI-109) — прятать в нём давно нечего.
    - ..:/app
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker -d tracker']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8000/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tracker-ui:latest
    environment:
      # Ключ, который интерфейс отдаст браузеру конфигурацией на своём источнике. Кладёт
      # его при старте контейнера `docker/config-json.sh`; значение приезжает из файла,
      # который выпустил сервис `local-token` ниже, — читает файл тот, кто зовёт compose
      # (`e2e/global-setup.ts`). Пустая переменная законна: тогда
      # конфигурации нет и работает экран входа.
      TRACKER_UI_TOKEN: ${TRACKER_UI_TOKEN:-}
    ports:
      # Только петля: с этого порта интерфейс раздаёт рабочий ключ набора `main` всякому,
      # кто его открыл. Публикация на все интерфейсы машины означала бы полный доступ
      # ко всему трекеру, включая выпуск доступов, для любого соседа по сети.
      #
      # 8081, а не 8080: на 8080 стоит установка (`../docker-compose.prod.yml`), и
      # общее умолчание означало бы, что прогон сквозных тестов падает на занятом порту
      # у всякого, кто держит интерфейс поднятым. Разные умолчания дешевле, чем
      # переменная, которую надо помнить: `pnpm e2e` работает без приставки.
      - '127.0.0.1:${UI_PORT:-8081}:80'
    healthcheck:
      # Именно 127.0.0.1: nginx слушает только IPv4, а `localhost` в контейнере
      # разрешается сначала в ::1 и проверка получала бы отказ соединения.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  # Миграции — явный шаг, а не часть старта приложения.
  migrate:
    <<: *backend
    command: alembic upgrade head
    profiles: ['tools']

  # Участник-владелец и его первый токен. Срабатывает только на пустой установке.
  init:
    <<: *backend
    command: python -m app.cli init
    profiles: ['tools']

  # Ключ интерфейса: установка выпускает его сама и кладёт в файл, не печатая никогда.
  # Зовётся после `init` — тот считает установку настроенной по наличию любого токена
  # и после ключа промолчал бы (`UI-75#6`). Права владельца это не отнимает: ключ
  # интерфейса сам набора `main` (`../docs/DEVELOPMENT.md`, «Ключ для локального интерфейса»).
  #
  # Файл ложится в `.secrets/` **этого** репозитория, а не в `../.secrets/`, куда
  # его кладут оба контура бэкенда. Там лежит ключ постоянной установки машины, и прогон
  # сквозных тестов, перевыпустивший его, отозвал бы ключ живого интерфейса на 8080:
  # `local-token` отзывает прежний одноимённый токен тем же действием.
  #
  # Точка монтирования подменяет собой `/app/.secrets` из смонтированного репозитория
  # бэкенда — так путь `--output` совпадает с рабочим каталогом образа и команда печатает
  # человеку путь, который на хосте существует.
  local-token:
    <<: *backend
    command: python -m app.cli local-token --output .secrets/ui-token
    volumes:
      - ..:/app
      - ./.secrets:/app/.secrets
    profiles: ['tools']

  # Демо-данные: очередь DEMO, задачи во всех статусах, открытый вопрос владельцу.
  demo:
    <<: *backend
    command: python -m app.cli demo
    profiles: ['tools']

volumes:
  pgdata:
