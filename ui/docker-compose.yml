# Контур для сборки и сквозных тестов: интерфейс из этого репозитория и бэкенд
# из соседнего. Поднимается одной командой: docker compose up -d --wait
#
# Наружу публикуется только интерфейс. Бэкенд и база видны лишь внутри сети compose:
# рабочий контур трекера (`../tracker/docker-compose.yml`) держит 8000, 8100 и 5432
# постоянно, и второй набор тех же портов просто не поднялся бы. Заодно это ровно тот
# способ, которым интерфейс работает в проде: `/api` проксирует nginx на свой источник.
#
# Разовые сервисы спрятаны за профилем `tools`: они не должны стартовать вместе с UI.

name: tracker-ui

x-backend: &backend
  build:
    context: ../tracker
    dockerfile: docker/Dockerfile.dev
  image: tracker-ui-backend:latest
  environment:
    TRACKER_ENVIRONMENT: local
    TRACKER_DEBUG: 'true'
    TRACKER_DATABASE_URL: postgresql+asyncpg://tracker:tracker@db:5432/tracker
  volumes:
    # Образ разработки бэкенда несёт только зависимости, код приезжает томом —
    # так же, как в его собственном контуре.
    - ../tracker:/app
    - /app/.venv
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker -d tracker']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8000/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tracker-ui:latest
    ports:
      # 8081, а не 8080: на 8080 стоит постоянный контур (`docker-compose.prod.yml`), и
      # общее умолчание означало бы, что прогон сквозных тестов падает на занятом порту
      # у всякого, кто держит интерфейс поднятым. Разные умолчания дешевле, чем
      # переменная, которую надо помнить: `pnpm e2e` работает без приставки.
      - '${UI_PORT:-8081}:80'
    healthcheck:
      # Именно 127.0.0.1: nginx слушает только IPv4, а `localhost` в контейнере
      # разрешается сначала в ::1 и проверка получала бы отказ соединения.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  # Миграции — явный шаг, а не часть старта приложения.
  migrate:
    <<: *backend
    command: alembic upgrade head
    profiles: ['tools']

  # Участник-владелец и его первый токен. Срабатывает только на пустой установке.
  init:
    <<: *backend
    command: python -m app.cli init
    profiles: ['tools']

  # Демо-данные: очередь DEMO, задачи во всех статусах, открытый вопрос владельцу.
  demo:
    <<: *backend
    command: python -m app.cli demo
    profiles: ['tools']

volumes:
  pgdata:
