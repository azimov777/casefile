[project]
name = "tracker"
version = "0.1.0"
description = "Бэкенд таск-трекера: REST API для фронтенда и MCP-сервер для агентов"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # HTTP-клиент нужен доставщику вебхуков (`app/webhooks.py`) — это рантайм, а не
    # только тесты. Тестам он тоже нужен, но объявлять его дважды нельзя: разъехавшиеся
    # версии дали бы разное поведение таймаутов на дев-контуре и на проде.
    "httpx>=0.28",
    # Официальный SDK Model Context Protocol: транспорт, протокол и объявление
    # инструментов для MCP-сервера (`app/mcp/`). Версия 2.x — в ней FastMCP
    # переименован в `MCPServer`, а server-to-client нотификации идут подписками
    # (`subscriptions/listen`), а не постоянным GET-потоком.
    "mcp>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Докстринги и комментарии проекта — на русском, поэтому RUF002 и RUF003 отключены.
# RUF001 (строковые литералы) оставлен включённым намеренно: сообщения об ошибках,
# описания схем и логи должны быть на английском, и правило это стережёт.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Шаблон миграции всегда тянет sa и op — в пустых ревизиях они не используются.
"app/db/migrations/versions/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
