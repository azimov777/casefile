[project]
name = "tracker"
version = "0.1.0"
license = "MIT"
description = "Бэкенд таск-трекера: REST API для фронтенда и MCP-сервер для агентов"
requires-python = ">=3.14"
# Здесь только нижние границы — с какой версии проект работает. Какие версии ставят образы
# и конвейер, решает `uv.lock`: закрепляет lock-файл, а не манифест. Правка списков ниже
# идёт тем же коммитом, что и lock-файл (`docker compose run --rm lock`), — иначе сборка
# образа падает (`docs/DEVELOPMENT.md`, раздел «Зависимости»).
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Официальный SDK Model Context Protocol: транспорт, протокол и объявление
    # инструментов для MCP-сервера (`app/mcp/`). Версия 2.x — в ней FastMCP
    # переименован в `MCPServer`, а server-to-client нотификации идут подписками
    # (`subscriptions/listen`), а не постоянным GET-потоком.
    "mcp>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    # HTTP-клиент нужен не приложению, а тестам REST API: `tests/conftest.py` (фикстура
    # `client`) и почти весь `tests/` ходят по ASGI (`httpx.AsyncClient` + `ASGITransport`)
    # без сети и без реального сервера. Приложение его не импортирует (`grep -rn httpx
    # app/` пусто), прод-образ (`docker/Dockerfile.prod`) ставит зависимости без этой
    # extra, и SDK MCP этот пакет не тянет — у него отдельная зависимость `httpx2`
    # (`docs/notes/mcp.md`, `uv.lock`). Решено TRK-94.
    "httpx>=0.28",
    # Объявлена явно, хотя приезжает и так: её тянет сам SDK MCP — ею он сверяет ответ
    # инструмента с объявленной `outputSchema` на стороне клиента. Тест делает ровно то
    # же самое (`tests/test_mcp_tools.py`), и зависимость теста от библиотеки должна
    # быть названа, а не держаться на том, что кто-то другой её принёс.
    "jsonschema>=4.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]
# Кеш живёт вне репозитория намеренно. Линтер гоняется в контейнере, а репозиторий
# смонтирован туда целиком: `.ruff_cache` в рабочем каталоге появлялся бы на хосте
# от root — на Linux хозяин установки не может такой каталог даже удалить
# (`docs/notes/docker.md`). Файлам, которых репозиторию не нужно, проще там не
# заводиться, чем возвращаться хозяину.
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Докстринги и комментарии проекта — на русском, поэтому RUF002 и RUF003 отключены.
# RUF001 (строковые литералы) оставлен включённым намеренно: сообщения об ошибках,
# описания схем и логи должны быть на английском, и правило это стережёт.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Шаблон миграции всегда тянет sa и op — в пустых ревизиях они не используются.
"app/db/migrations/versions/*" = ["F401"]
# Справочник кодов ошибок собирает русский текст документации (`docs/ERRORS.md`), а не
# сообщения API: сами сообщения приезжают сюда из классов исключений и остаются
# английскими. Держать документ на английском значило бы сделать его единственным
# русскоязычным документом проекта, написанным не по-русски.
"app/api/contract.py" = ["RUF001"]
# Описания инструментов и их аргументов читает модель, и по требованию задачи 28 они на
# русском: агент работает с трекером по-русски, и английское описание рядом с русским
# скилом заставляло бы его переводить дисциплину на ходу. Служебный слой при этом
# английский по-прежнему: коды ошибок, имена полей и значения перечислений приезжают
# сюда из домена и здесь не пишутся.
"app/mcp/arguments.py" = ["RUF001"]
"app/mcp/tools/*" = ["RUF001"]
# Демо-набор целиком состоит из пользовательских данных: названия очередей и задач,
# описания, реплики, имена акторов и колонок. Соглашения оставляют русский именно там,
# и правило, стерегущее английский в служебном слое, здесь срабатывает на каждой строке
# набора, ничего не защищая.
"app/services/demo.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Тот же случай, что у `cache-dir` линтера выше: `.pytest_cache` в смонтированном
# репозитории — это каталог от root на машине хозяина.
cache_dir = "/tmp/pytest-cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
