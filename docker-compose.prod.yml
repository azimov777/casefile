# Продакшен-контур: тот же набор сервисов, что и в разработке, но из прод-образа.
# Отличия от dev: код внутри образа, тома с исходниками нет, автоперезапуска нет,
# порт БД наружу не публикуется, значения секретов обязательны.
#
# Запуск: docker compose -f docker-compose.prod.yml up -d --build

name: tracker-prod

x-app-environment: &app-environment
  TRACKER_ENVIRONMENT: production
  TRACKER_DEBUG: "false"
  TRACKER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER обязателен}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@db:5432/${POSTGRES_DB:?POSTGRES_DB обязателен}
  TRACKER_CORS_ORIGINS: ${TRACKER_CORS_ORIGINS:?TRACKER_CORS_ORIGINS обязателен}

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/Dockerfile.prod
  image: tracker-prod:latest
  environment: *app-environment
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB обязателен}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${TRACKER_PORT:-8000}:8000"
    healthcheck:
      # curl в прод-образе нет намеренно: проверка идёт средствами самого Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MCP-сервер для агентов. Отдельный сервис по той же причине, что и в дев-контуре:
  # его соединения долгие (долгое ожидание ленты), и держать их в одной очереди с
  # запросами фронтенда нельзя. Реплик может быть несколько — состояние
  # сессии живёт в процессе, поэтому балансировщик обязан закреплять клиента за одной.
  mcp:
    <<: *app-service
    command: python -m app.mcp
    ports:
      - "${TRACKER_MCP_PORT:-8100}:8100"
    healthcheck:
      # curl в прод-образе нет намеренно: проверка идёт средствами самого Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Вызов инструмента доводится до конца по сигналу остановки: он может писать в базу.
    stop_grace_period: 30s

  migrate:
    <<: *app-service
    command: alembic upgrade head
    restart: "no"
    profiles: ["tools"]

  # Первичная настройка установки: участник-владелец и его первый токен набора `main`.
  # Без неё API заперт — каждый маршрут `/api/v1` требует токена, а выпустить первый токен
  # через API нельзя. Срабатывает только на пустой установке: если токен уже есть, команда
  # ничего не создаёт и говорит об этом.
  init:
    <<: *app-service
    command: python -m app.cli init
    restart: "no"
    profiles: ["tools"]

  # Выгрузка схемы OpenAPI. В прод-образе код лежит в `/app` и записать туда результат
  # нельзя — образ собран под непривилегированного пользователя, — поэтому файл пишется
  # в стандартный вывод, а на хосте перенаправляется:
  #
  #   docker compose -f docker-compose.prod.yml run --rm --no-deps schema > openapi.json
  schema:
    <<: *app-service
    command: python -m app.cli openapi
    restart: "no"
    profiles: ["tools"]

volumes:
  pgdata:
