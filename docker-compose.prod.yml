# Casefile на этой машине: всё, что нужно трекеру, поднимается одной командой —
#   docker compose -f docker-compose.prod.yml up -d
#
# Продакшен-контур из готовых образов: их собирает конвейер (`.github/workflows/images.yml`)
# и публикует в ghcr.io — выпуск с git-тегом `vX.Y.Z` под номером версии и под подвижным
# тегом канала выпусков `stable`, каждый коммит main под `latest`. Исходников, томов с
# кодом и сборки здесь нет — поэтому тот же файл работает и из клона репозитория, и из
# каталога установки, куда его кладёт установщик одной строкой (`install.sh`,
# `install.ps1`). Сам этот файл тоже едет в образе выпуска (`/app/docker-compose.prod.yml`):
# установщик и обновлятор берут его оттуда, и файл всегда того же выпуска, что и образы.
# Секции `build:` нет намеренно: в каталоге установки относительный контекст сборки
# означал бы чужой каталог пользователя целиком.
#
# Порядок старта: db → migrate → local-token → agent-token → api и mcp → ui. Разовые
# шаги идут на каждом подъёме и идемпотентны: миграции поверх применённых, ключи из своих
# томов. Миграции — init-контейнер, а не часть старта приложения: несколько реплик,
# применяющих их одновременно, дают гонку (`docs/CONVENTIONS.md`, «Запуск»).
#
# Автообновление — служба `updater` в конце файла: при каждом старте Docker и дальше раз в
# час она сверяет образы канала выпусков и, если вышел новый выпуск, пересоздаёт службы;
# данные остаются в томах. Выключается `CASEFILE_AUTO_UPDATE=false` в `.env`, закрепляется
# на выпуске `CASEFILE_VERSION=X.Y.Z`.
#
# Наружу смотрят два порта: интерфейс (он же REST через прокси `/api`) и MCP для агентов.
# База и API видны лишь внутри сети compose. Оба порта публикуются на `CASEFILE_BIND` —
# по умолчанию это петля, и установку видит только эта машина. Выставить установку в сеть
# (`CASEFILE_BIND=0.0.0.0`) можно только в режиме входа по учётным записям
# (`CASEFILE_LOGIN=password`): без него интерфейс не поднимется — README, «Network mode».

name: casefile

# Что контур задаёт сам. Эти переменные приезжают в контейнер настоящим окружением и
# побеждают `.env`: адрес базы собирается из реквизитов сервиса `db`, и строка из файла
# подменять его не должна. Всё остальное приложение берёт из `.env`.
x-app-environment: &app-environment
  TRACKER_ENVIRONMENT: production
  TRACKER_DEBUG: "false"
  TRACKER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
  # Браузеру CORS здесь не нужен: интерфейс ходит в API через свой же источник. Значение
  # оставлено тем же, что в дев-контуре, — для фронтенда, запущенного отдельно.
  TRACKER_CORS_ORIGINS: ${TRACKER_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  # Единственная настройка, которую читают обе стороны: compose подставляет её в проброс
  # портов, а процесс MCP слушает то, что пришло в контейнер. Оставленная только в `.env`,
  # она двигала бы публикацию и не двигала бы сервер (`docs/notes/docker.md`).
  TRACKER_MCP_PORT: ${TRACKER_MCP_PORT:-8100}
  # Адрес MCP снаружи, который API сообщает интерфейсу (`GET /api/v1/installation`), —
  # тот, что клиент агента кладёт в свою конфигурацию. Пусто — `localhost` на порту
  # строкой выше, и для этой машины это верно; задают его, когда MCP видят через прокси,
  # по TLS или с другой машины. Объявлен здесь, а не оставлен `.env`, по той же причине,
  # что и порт: иначе значение из командной строки не дошло бы до процесса API.
  TRACKER_MCP_PUBLIC_URL: ${TRACKER_MCP_PUBLIC_URL:-}
  # Пароль установки, запиравший её до учётных записей. Замком он больше не служит:
  # `local-token` переносит его паролем в учётную запись администратора `owner@localhost`,
  # если пароля у неё ещё нет (`docs/CONCEPT.md`, 5.4). Объявлен здесь по той же причине,
  # что и адрес выше, и ещё по одной: у установки, где он стоит, из этой же подстановки
  # контур выводит режим входа интерфейса (служба `ui`) — после обновления она остаётся
  # закрытой входом, а не начинает раздавать ключ администратора.
  TRACKER_PASSWORD_HASH: ${TRACKER_PASSWORD_HASH:-}
  # Кому API верит адрес клиента для окна попыток входа (`app/api/client_address.py`):
  # службе `ui`, то есть nginx этой установки. Он перезаписывает `X-Real-IP` адресом,
  # который видел сам, а за прокси — адресом, который назвал прокси из
  # `CASEFILE_TRUSTED_PROXIES` (служба `ui` ниже). API наружу не опубликован, и другого
  # пути к нему, кроме этого nginx, у клиента нет. Не настройка владельца: задаёт контур.
  TRACKER_REAL_IP_FROM: ui

x-app-service: &app-service
  # Образ бэкенда один на все его процессы. Реестр и тег задаются переменными, чтобы
  # установку можно было держать на своей копии образа или закрепить на выпуске. Умолчание —
  # канал выпусков `stable`: коммит main без тега до установки не доходит.
  image: ${CASEFILE_REGISTRY:-ghcr.io/azimov777}/casefile:${CASEFILE_VERSION:-stable}
  # Настройки установки правятся в `.env` рядом с этим файлом — тем же способом и тем же
  # набором переменных, что и в дев-контуре. Файл читает compose на хосте: внутрь образа
  # он не копируется. `required: false` — без файла контур поднимается на умолчаниях.
  env_file:
    - path: .env
      required: false
  environment: *app-environment
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

# Ревизия службы `updater`: по ней `updater-renew` узнаёт обновлятор прежнего выпуска.
# Это хеш определения `updater` без самой метки; тест сверяет его и называет верное
# значение, когда служба поменялась (`tests/test_auto_update.py`).
x-updater-revision: &updater-revision "b26f11d0a12a"

services:
  db:
    image: postgres:17-alpine
    # Реквизиты с умолчаниями, а не обязательные: база не публикуется наружу, и пароль
    # виден только процессам этой сети. Обязательность стоила бы установке одной строкой
    # шага подготовки — ровно того, от которого она избавляет.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: alembic upgrade head
    restart: "no"

  # Ключ интерфейса: действующий токен набора `main` владельца в томе `ui-key`, откуда его
  # берёт `ui` и отдаёт браузеру конфигурацией на своём источнике. Набор `main`: человек
  # здесь и есть владелец установки и выпускает доступы агентов в интерфейсе. Секрет не
  # печатается никогда; повтор видит годный ключ и не выпускает ничего, а годный ключ
  # другого набора заменяет с отзывом прежнего (`app/services/setup.py`). На хост ключ не
  # выходит: том именованный, и владельца файлу назначать некому и незачем.
  #
  # Тот же шаг заводит владельцу учётную запись администратора `owner@localhost` и
  # переносит в неё прежний `TRACKER_PASSWORD_HASH`. В режиме входа ключ из тома не
  # отдаётся никому: каждый человек получает свой входом (`ui/docker/access-mode.sh`).
  local-token:
    <<: *app-service
    command: python -m app.cli local-token --output .secrets/ui-token
    volumes:
      - ui-key:/app/.secrets
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Токен агента этой машины: набор `main` участника `agent` в томе `agent-key`. Его берёт
  # установщик, чтобы напечатать человеку готовую команду подключения к MCP:
  #   docker compose run --rm --no-deps -T agent-token cat .secrets/agent-token
  # Том отдельный от `ui-key`: интерфейсу этот токен не нужен, и в его контейнер он не
  # попадает. Идёт после `local-token`, хотя порядок им и не важен (`app/services/setup.py`):
  # два шага, пишущие в базу одновременно, спорили бы за первого участника.
  agent-token:
    <<: *app-service
    command: python -m app.cli agent-token --output .secrets/agent-token
    volumes:
      - agent-key:/app/.secrets
    restart: "no"
    depends_on:
      local-token:
        condition: service_completed_successfully

  api:
    <<: *app-service
    # Срок остановки — последний рубеж, а не основной механизм: поток ленты кончается
    # сам по сигналу (`app/core/shutdown.py`).
    #
    # Процесс один, и `--workers` здесь нет намеренно: окна попыток входа живут в памяти
    # процесса (`app/services/login.py`), и несколько процессов умножили бы разрешённое
    # число попыток на число процессов. Сами сеансы — токены в базе, им это не важно.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 10
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # curl в прод-образе нет намеренно: проверка идёт средствами самого Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MCP-сервер для агентов. Отдельный сервис: его соединения долгие (долгое ожидание
  # ленты), и держать их в одной очереди с запросами интерфейса нельзя. Ждёт токен агента,
  # поэтому `up -d` возвращается тогда, когда подключаться уже есть с чем.
  mcp:
    <<: *app-service
    command: python -m app.mcp
    ports:
      # Адрес публикации общий с интерфейсом. MCP закрыт токеном на каждом вызове, поэтому
      # в сеть его можно выставить и без пароля — но в сеть уходят оба порта разом, а
      # интерфейс без режима входа не на петле не поднимется (служба `ui` ниже).
      - "${CASEFILE_BIND:-127.0.0.1}:${TRACKER_MCP_PORT:-8100}:${TRACKER_MCP_PORT:-8100}"
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent-token:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${TRACKER_MCP_PORT:-8100}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    image: ${CASEFILE_REGISTRY:-ghcr.io/azimov777}/casefile-ui:${CASEFILE_VERSION:-stable}
    # Ключ образ берёт из файла (`ui/docker/config-json.sh`), а не из переменной: секрет не
    # появляется в окружении контейнера, а том подключён только на чтение.
    environment:
      TRACKER_API_URL: http://api:8000
      TRACKER_UI_TOKEN_FILE: /run/secrets/ui-token
      # Режим выдачи ключа: `password` — вход по учётным записям, пусто — своя машина.
      # Включает его владелец (`CASEFILE_LOGIN=password`); у установки, закрытой прежним
      # паролем, он включается сам — из той же подстановки `TRACKER_PASSWORD_HASH`, что
      # уходит в API. В режиме входа `/config.json` не отдаётся никому, каждый получает
      # свой токен входом по почте и паролю, а проверка `Host` снята
      # (`ui/docker/access-mode.sh`).
      TRACKER_UI_LOGIN: ${CASEFILE_LOGIN:-${TRACKER_PASSWORD_HASH:+password}}
      # Где опубликован порт. Контейнер его не видит, поэтому контур называет его сам:
      # адрес не на петле без пароля — отказ подняться, а не ключ `main` всей сети.
      TRACKER_UI_BIND: ${CASEFILE_BIND:-127.0.0.1}
      # Прокси перед установкой, которым nginx верит `X-Forwarded-For`: адреса и сети через
      # запятую, пусто — никому, и клиент это тот, кто открыл соединение. За прокси с TLS
      # владелец называет его здесь, иначе все клиенты видны адресом прокси и окно попыток
      # входа у них одно на всех (README, «Network mode»; `ui/docker/access-mode.sh`).
      TRACKER_UI_TRUSTED_PROXIES: ${CASEFILE_TRUSTED_PROXIES:-}
    volumes:
      - ui-key:/run/secrets:ro
    ports:
      # По умолчанию только петля, и это не перестраховка: без пароля этот порт отдаёт
      # браузеру рабочий ключ установки, то есть полный доступ к ней, включая выпуск
      # доступов, всякому, кто его открыл. От страницы в том же браузере петля не
      # защищает — там границу держит проверка `Host` в nginx образа
      # (`ui/docker/nginx.conf.template`). В сеть — только в режиме входа.
      - "${CASEFILE_BIND:-127.0.0.1}:${CASEFILE_PORT:-8080}:80"
    healthcheck:
      # Именно 127.0.0.1: nginx слушает только IPv4, а `localhost` в контейнере
      # разрешается сначала в ::1.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      local-token:
        condition: service_completed_successfully
      # Не нужна интерфейсу, а привязана к нему, чтобы её запускал любой `up` этих служб, в
      # том числе `up -d db api mcp ui` обновлятора прежних выпусков (служба `updater-renew`),
      # `required: false`: служба, которая не поднялась, не держит интерфейс.
      updater-renew:
        condition: service_started
        required: false

  # Автообновление. Контейнеры с `restart: unless-stopped` Docker поднимает сам при своём
  # старте, но на прежних образах: `pull_policy` действует только на `docker compose up`.
  # Поэтому обновляет отдельная служба — при каждом своём старте, то есть при каждом
  # старте Docker, и дальше раз в `CASEFILE_UPDATE_INTERVAL` (умолчание — час).
  #
  # Новая версия — только выпуск с git-тегом: служба сверяет тег `CASEFILE_VERSION`, по
  # умолчанию канал выпусков `stable`, который конвейер двигает только на тег `vX.Y.Z`
  # (`.github/workflows/images.yml`). Коммит main без тега уходит под `latest` и сюда не
  # доходит. Закреплённый `CASEFILE_VERSION=X.Y.Z` не движется вовсе.
  #
  # Цикл: `pull` образов Casefile; из свежего образа `api` достать этот файл его выпуска и,
  # если он другой, записать поверх; если что-то изменилось — `up -d` и уборка образов,
  # которые служили до обновления. Себя служба в `up` не называет: пересоздав себя, она
  # оборвала бы собственную команду на середине, — её заменяет `updater-renew`. Нет сети —
  # служба пишет об этом и оставляет всё как есть.
  #
  # Выпуск, который не поднялся (`up` упал или api, mcp, ui не стали здоровыми за три
  # минуты), откатывается: перед `up` служба держит образы прежнего выпуска под своими
  # локальными тегами `casefile-updater/<проект>/…:previous` и копию этого файла, при
  # неудаче возвращает на них службы без `migrate` и помечает упавший выпуск тегами
  # `…:failed`. Пока под тегом канала стоит он же, проверки его не пробуют, а следующий
  # выпуск идёт как обычно (TRK-122, `docs/notes/docker.md`).
  #
  # `pull`, а не отдельный запрос к манифесту: `pull` неизменного тега и есть запрос
  # манифеста, а образ всё равно нужен локально — достать из него этот файл. Раз в час два
  # образа — далеко от лимитов анонимного ghcr.io. Проверки идут не по часам, а от старта
  # службы, с разбросом до шестой доли интервала: установки не приходят в реестр разом.
  #
  # `up` только при изменении — не экономия, а обход: compose внутри видит `.env` по
  # пути `/project/.env`, а путь `env_file` входит в хеш конфигурации службы. Безусловный
  # `up` отсюда пересоздавал бы службы приложения на каждой проверке, хотя не изменилось
  # ничего (TRK-58).
  #
  # Сокет Docker — это права root на машине, и они даны этой службе сознательно: без них
  # обновлять контейнеры нечем. Кому это не подходит, выключает службу переменной
  # `CASEFILE_AUTO_UPDATE=false` и обновляет установку повторным запуском установщика.
  #
  # Каталог установки смонтирован целиком, потому что compose внутри читает отсюда этот
  # файл и `.env`. Путей хоста в остальных службах нет, поэтому то, что compose внутри
  # видит каталог под другим именем, ничего не ломает — в том числе на Windows.
  updater:
    image: docker:29-cli
    working_dir: /project
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
    environment:
      COMPOSE_FILE: docker-compose.prod.yml
      CASEFILE_AUTO_UPDATE: ${CASEFILE_AUTO_UPDATE:-true}
      CASEFILE_UPDATE_INTERVAL: ${CASEFILE_UPDATE_INTERVAL:-1}
    # По этой метке `updater-renew` узнаёт обновлятор прежнего выпуска.
    labels:
      casefile.updater.revision: *updater-revision
    restart: unless-stopped
    # На `docker compose up` служба стартует последней, когда контур уже поднят: иначе два
    # compose — подъёма и её собственный — создавали бы одни и те же контейнеры наперегонки.
    # На старте Docker зависимости не действуют, и это ничему не мешает: контейнеры там
    # поднимает сам Docker, а compose службы только пересоздаёт изменившиеся.
    depends_on:
      mcp:
        condition: service_healthy
      ui:
        condition: service_healthy
    # `$$` — буквальный доллар для оболочки: одиночный compose подставил бы сам.
    command:
      - sh
      - -c
      - |
        log() { printf 'casefile-updater: %s\n' "$$*"; }

        # Проект compose — тот, в котором запущен этот контейнер, а не `name:` файла:
        # установка, поднятая под другим именем, иначе обновляла бы чужую.
        COMPOSE_PROJECT_NAME=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$$(hostname)") || exit 1
        export COMPOSE_PROJECT_NAME

        # Секунды между проверками: число — часы, `30m` — минуты, `90s` — секунды.
        # 0 или непонятное значение — только проверка на старте.
        period() {
          case "$$CASEFILE_UPDATE_INTERVAL" in
            *s) n=$${CASEFILE_UPDATE_INTERVAL%s} k=1 ;;
            *m) n=$${CASEFILE_UPDATE_INTERVAL%m} k=60 ;;
            *h) n=$${CASEFILE_UPDATE_INTERVAL%h} k=3600 ;;
            *) n=$$CASEFILE_UPDATE_INTERVAL k=3600 ;;
          esac
          case "$$n" in
            '' | *[!0-9]*) echo 0 ;;
            *) echo "$$((n * k))" ;;
          esac
        }

        # Образ службы по этому файлу. Не `config --images <служба>`: та печатает и образы
        # всех её зависимостей.
        image_of() {
          docker compose config |
            awk -v s="$$1" '/^  [^ ]/ { cur = $$1 } cur == s ":" && /^    image: / { print $$2; exit }'
        }

        # Выпуск образа по метке, которую ставит конвейер; у своей сборки её нет.
        version() {
          docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$$1" 2>/dev/null
        }

        # Печатает `changed`, если этот файл заменён файлом из образа выпуска.
        refresh_compose() {
          image=$$(image_of api)
          [ -n "$$image" ] || return 0
          if docker run --rm --pull never --network none --entrypoint cat "$$image" \
            /app/docker-compose.prod.yml >/tmp/compose.yml 2>/dev/null &&
            docker compose -f /tmp/compose.yml --project-directory /project config --quiet; then
            if ! cmp -s /tmp/compose.yml "$$COMPOSE_FILE"; then
              # Запись поверх, а не замена файла: владелец и права остаются хозяйскими.
              cat /tmp/compose.yml >"$$COMPOSE_FILE"
              log "compose file updated from $$image" >&2
              echo changed
            fi
          else
            log "no usable compose file in $$image, keeping the current one" >&2
          fi
        }

        # Id образа, на котором служба работает; пусто — её контейнера нет.
        running_of() {
          container=$$(docker compose ps -q "$$1")
          [ -z "$$container" ] || docker inspect -f '{{.Image}}' "$$container"
        }

        # Id образа, который сейчас стоит под тегом, заданным службе этим файлом.
        wanted_of() {
          docker image inspect -f '{{.Id}}' "$$(image_of "$$1")" 2>/dev/null
        }

        # Успех — какая-то служба не запущена или запущена не на том образе, что сейчас
        # стоит под тегом, который ей задаёт этот файл. Сверка с тегом файла, а не с тегом
        # контейнера: иначе смена канала или закрепление выпуска не применялись бы.
        outdated() {
          for service in api mcp ui; do
            running=$$(running_of "$$service")
            [ -n "$$running" ] || return 0
            wanted=$$(wanted_of "$$service") || return 0
            [ "$$running" = "$$wanted" ] || return 0
          done
          return 1
        }

        # Образы, на которых службы работают сейчас: после обновления их убирают.
        running_images() {
          for service in api mcp ui; do
            running_of "$$service"
          done | sort -u
        }

        # Свои локальные теги обновлятора: `previous` — выпуск, с которого идёт обновление,
        # `failed` — выпуск, который здесь не поднялся. containerd удаляет образ вместе с
        # последним именем, и без `previous` прежнего выпуска после `pull` уже не было бы.
        # Проект в имени: установки на одной машине тегов не делят.
        kept() { echo "casefile-updater/$$COMPOSE_PROJECT_NAME/$$1"; }

        # Успех — под тегами файла стоит ровно тот выпуск (api и ui), что уже не поднялся.
        failed_again() {
          failed_api=$$(docker image inspect -f '{{.Id}}' "$$(kept api:failed)" 2>/dev/null) || return 1
          failed_ui=$$(docker image inspect -f '{{.Id}}' "$$(kept ui:failed)" 2>/dev/null) || return 1
          [ "$$(wanted_of api)" = "$$failed_api" ] && [ "$$(wanted_of ui)" = "$$failed_ui" ]
        }

        # Теги файла — обратно на образы, на которых службы работают: иначе `pull` оставил
        # бы под ними упавший выпуск, и его поднял бы первый же ручной `docker compose up`.
        hold_back() {
          for service in api ui; do
            running=$$(running_of "$$service")
            [ -z "$$running" ] || docker tag "$$running" "$$(image_of "$$service")"
          done
        }

        # Успех — api, mcp и ui здоровы. Сам `up` падает только на нездоровом api (от него
        # зависит ui), здоровье mcp и ui ждётся здесь. Предел — три минуты: дольше проверки
        # здоровья служб не тянутся.
        settled() {
          i=0
          while [ "$$i" -lt 36 ]; do
            states=$$(for service in api mcp ui; do
              container=$$(docker compose ps -q "$$service")
              if [ -n "$$container" ]; then
                docker inspect -f '{{.State.Health.Status}}' "$$container"
              else
                echo missing
              fi
            done | sort -u)
            case "$$states" in
              healthy) return 0 ;;
              *unhealthy* | *missing*) return 1 ;;
            esac
            sleep 5
            i=$$((i + 1))
          done
          return 1
        }

        # Службы — обратно на прежний выпуск: его образы под тегами `previous`, его файл —
        # в копии. Без `migrate` и остальных разовых шагов (`--no-deps`): упавший выпуск мог
        # продвинуть схему, а `alembic upgrade head` прежнего кода её ревизии не знает.
        roll_back() {
          [ -z "$$changed" ] || cat /tmp/previous-compose.yml >"$$COMPOSE_FILE"
          docker tag "$$(kept api:previous)" "$$(image_of api)" &&
            docker tag "$$(kept ui:previous)" "$$(image_of ui)" &&
            docker compose up -d --no-deps db api mcp ui && settled
        }

        update() {
          if ! docker compose pull --quiet api ui; then
            log "could not pull images (offline?), keeping the current ones"
            return 0
          fi
          # Выпуск, который здесь уже не поднялся, не пробуется снова — до следующего.
          if failed_again; then
            hold_back
            failed=$$(version "$$(kept api:failed)")
            log "$${failed:-the release on this tag} did not start here before; waiting for the next release"
            return 0
          fi
          cp "$$COMPOSE_FILE" /tmp/previous-compose.yml
          changed=$$(refresh_compose)
          # Новый файл может звать другие образы — их тоже скачать до `up`.
          if [ -n "$$changed" ] && ! docker compose pull --quiet api ui; then
            log "could not pull images (offline?), keeping the current ones"
            return 0
          fi
          if [ -z "$$changed" ] && ! outdated; then
            log "already up to date"
            return 0
          fi
          previous=$$(running_images)
          running=$$(running_of api)
          before=$$([ -z "$$running" ] || version "$$running")
          for service in api ui; do
            running=$$(running_of "$$service")
            [ -z "$$running" ] || docker tag "$$running" "$$(kept "$$service:previous")"
          done
          image=$$(image_of api)
          after=$$(version "$$image")
          if docker compose up -d db api mcp ui && settled; then
            log "updated to $${after:-$$image}"
            docker rmi "$$(kept api:failed)" >/dev/null 2>&1 || true
            docker rmi "$$(kept ui:failed)" >/dev/null 2>&1 || true
          else
            log "$${after:-$$image} failed to start, see: docker compose logs; going back to $${before:-the previous release}"
            docker tag "$$image" "$$(kept api:failed)"
            docker tag "$$(image_of ui)" "$$(kept ui:failed)"
            if roll_back; then
              log "rolled back to $${before:-the previous release}; $${after:-this release} will not be tried again, only the next release"
            else
              log "could not go back either, see: docker compose logs"
              [ -z "$$before" ] ||
                log "to go back by hand, put CASEFILE_VERSION=$$before into .env and run: docker compose up -d"
            fi
          fi
          # Образ, который ещё служит или носит другое имя, `rmi` без `-f` не тронет.
          docker rmi "$$(kept api:previous)" >/dev/null 2>&1 || true
          docker rmi "$$(kept ui:previous)" >/dev/null 2>&1 || true
          for image in $$previous; do
            docker rmi "$$image" >/dev/null 2>&1 || true
          done
        }

        trap 'exit 0' TERM INT
        if [ "$$CASEFILE_AUTO_UPDATE" = "false" ]; then
          log "auto-update is off (CASEFILE_AUTO_UPDATE=false)"
          while :; do sleep 86400 & wait $$!; done
        fi
        update
        seconds=$$(period)
        if [ "$$seconds" -eq 0 ]; then
          log "periodic checks are off (CASEFILE_UPDATE_INTERVAL=$$CASEFILE_UPDATE_INTERVAL), next check at the next Docker start"
          while :; do sleep 86400 & wait $$!; done
        fi
        while :; do
          jitter=$$(($$(od -An -N2 -tu2 /dev/urandom) % (seconds / 6 + 1)))
          sleep "$$((seconds + jitter))" & wait $$!
          update
        done

  # Замена самого обновлятора. `updater` не пересоздаёт себя, поэтому его новая команда из
  # выпуска иначе не доехала бы до установки никогда — ни раз в час, ни при старте Docker:
  # контейнер живёт со своей командой до ручного `docker compose up`. Эта разовая служба —
  # зависимость `ui`, поэтому её запускает всякий `up` этих служб, и прежде всего
  # `up -d db api mcp ui` самого обновлятора — в том числе обновлятора прежних выпусков,
  # который ничего о ней не знает. Так установки, стоявшие на `latest`, переходят на канал
  # выпусков сами: прежний обновлятор берёт этот файл, поднимает службы на `stable`, а эта
  # служба затем меняет его на обновлятор из файла.
  #
  # Обновлятор меняется, только если его метка ревизии не та, что здесь, и только если
  # `up` зовёт он: в нём сейчас идёт `docker`. Тогда служба ждёт, пока он кончит, и
  # пересоздаёт его. Если он спит, `up` зовёт установщик или человек, и обновлятор
  # пересоздаст их же `up`; два compose разом кончились бы ошибкой имени контейнера.
  # Ревизию сверяет тест с хешем определения `updater` (`tests/test_auto_update.py`): поменял
  # службу — поменяй метку.
  #
  # Каталога установки здесь нет, только сокет: службу создаёт compose изнутри обновлятора,
  # а там `.` — это `/project`, которого демон не знает, и монтирование не состоялось бы
  # (`docs/notes/docker.md`). Путь каталога со стороны демона служба берёт у самого
  # обновлятора — источник его `/project` — и зовёт `up` из разового контейнера, где
  # каталог смонтирован по этому же пути: тогда и `.:/project` нового обновлятора
  # разрешается в путь, который демон знает.
  updater-renew:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CASEFILE_UPDATER_REVISION: *updater-revision
    restart: "no"
    command:
      - sh
      - -c
      - |
        log() { printf 'casefile-updater-renew: %s\n' "$$*"; }

        project=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$$(hostname)") || exit 0
        updater=$$(docker ps -q --filter "label=com.docker.compose.project=$$project" \
          --filter label=com.docker.compose.service=updater)
        [ -n "$$updater" ] || exit 0
        have=$$(docker inspect -f '{{index .Config.Labels "casefile.updater.revision"}}' "$$updater")
        [ "$$have" != "$$CASEFILE_UPDATER_REVISION" ] || exit 0

        busy() {
          docker top "$$updater" -o pid,comm 2>/dev/null |
            awk 'NR > 1 && $$2 ~ /^docker/ { found = 1 } END { exit !found }'
        }
        busy || exit 0
        # Предел — полчаса: столько не идёт ни одно обновление.
        i=0
        while busy && [ "$$i" -lt 360 ]; do
          sleep 5
          i=$$((i + 1))
        done

        directory=$$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/project"}}{{.Source}}{{end}}{{end}}' "$$updater")
        case "$$directory" in
          /*) ;;
          *)
            log "cannot tell where the installation lives ($$directory); run the installer again to get the new updater"
            exit 0
            ;;
        esac
        log "replacing the updater of an earlier release"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$$directory:$$directory" -w "$$directory" \
          -e COMPOSE_PROJECT_NAME="$$project" -e COMPOSE_FILE=docker-compose.prod.yml \
          docker:29-cli docker compose up -d --no-deps updater

volumes:
  pgdata:
  ui-key:
  agent-key:
