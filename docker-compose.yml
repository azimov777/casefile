# Контур разработки. Поднимается одной командой: docker compose up
#
# Сервисы migrate, test и lint спрятаны за профилем tools: они не должны стартовать
# вместе с сервером. Запускаются точечно: docker compose run --rm <сервис>.

name: tracker

x-app-environment: &app-environment
  TRACKER_ENVIRONMENT: local
  TRACKER_DEBUG: "true"
  TRACKER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
  TRACKER_TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}_test
  TRACKER_CORS_ORIGINS: ${TRACKER_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  image: tracker-dev:latest
  environment: *app-environment
  volumes:
    # Исходники монтируются целиком: правка файла видна контейнеру сразу.
    - ./:/app
    # Анонимный том прячет .venv хоста — виртуальное окружение внутри своё, системное.
    - /app/.venv
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    ports:
      # Порт наружу — чтобы смотреть базу клиентом с хоста; приложение ходит по сети compose.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${TRACKER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Воркер шины событий: разбирает outbox и раздаёт события подписчикам.
  #
  # Отдельный сервис, а не поток внутри API. Поток размножился бы вместе с репликами
  # веб-процесса, и каждое событие обработалось бы столько раз, сколько их запущено:
  # три уведомления вместо одного, три вызова вебхука, три срабатывания правила.
  #
  # Автоперезапуска по изменению файлов у него нет — uvicorn перезапускает только себя.
  # После правки кода подписчика: docker compose restart worker
  worker:
    <<: *app-service
    command: python -m app.worker
    # Воркер доводит текущее событие до конца и только потом выходит. Запас времени
    # больше стандартных десяти секунд: доставка может ждать внешнего адреса.
    stop_grace_period: 30s

  # Планировщик автодействий: будит правила автоматики, которым пришло время.
  #
  # Обязан быть в ЕДИНСТВЕННОМ экземпляре. Две реплики выполнят каждое автодействие
  # дважды: два комментария, два снятых исполнителя, две волны событий. Воркер событий
  # так масштабировать можно — там строки разводит FOR UPDATE SKIP LOCKED в самой
  # очереди; здесь такая же блокировка стоит на строке правила, но она страхует от
  # ошибки развёртывания, а не заменяет единственность.
  #
  # Автоперезапуска по изменению файлов у него нет, как и у воркера.
  # После правки кода правил: docker compose restart scheduler
  scheduler:
    <<: *app-service
    command: python -m app.scheduler
    # Одно автодействие может перебрать сотни задач, и каждая идёт через те же сценарии,
    # что и обычный запрос. Запас времени тот же, что у воркера.
    stop_grace_period: 30s

  # Доставщик вебхуков: разбирает очередь заданий и делает HTTP-запросы наружу.
  #
  # Отдельный сервис, а не подписчик внутри воркера. Воркер разбирает события по одному,
  # и отправка HTTP прямо из подписчика означала бы, что мёртвый адрес держит всю очередь
  # событий на своём таймауте: не доходят уведомления, не срабатывает автоматика.
  #
  # Реплик может быть несколько: задания разводит FOR UPDATE SKIP LOCKED, как и события.
  # Смысл в этом появляется, когда адресов много и часть из них медленная.
  #
  # После правки кода доставки: docker compose restart webhooks
  webhooks:
    <<: *app-service
    command: python -m app.webhooks
    # Текущая доставка доводится до конца по сигналу остановки. Запас времени больше
    # стандартных десяти секунд: попытка ждёт таймаута внешнего адреса.
    stop_grace_period: 30s

  # MCP-сервер для агентов: streamable HTTP на своём порту.
  #
  # Отдельный сервис, а не маршрут внутри API. Клиент MCP держит соединение открытым и
  # ждёт на нём: ожидание уведомлений висит десятками секунд, поток подписок — всю
  # сессию, и такие соединения нельзя ставить в очередь к запросам фронтенда. Плюс
  # агентов может быть десять при одном фронтенде — масштабируется это отдельно.
  #
  # Автоперезапуска по изменению файлов у него нет, как у воркера и планировщика.
  # После правки инструментов: docker compose restart mcp
  mcp:
    <<: *app-service
    command: python -m app.mcp
    ports:
      - "${TRACKER_MCP_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Вызов инструмента доводится до конца по сигналу остановки: он может писать в
    # базу, а оборванная посреди работы транзакция хуже лишних секунд ожидания.
    stop_grace_period: 30s

  # Миграции — явный шаг, а не часть старта приложения: несколько реплик, применяющих
  # миграции одновременно, дают гонку и испорченную схему.
  migrate:
    <<: *app-service
    command: alembic upgrade head
    profiles: ["tools"]

  # Первичная настройка установки: владелец и его первый токен. Без неё API заперт —
  # каждый маршрут `/api/v1` требует токена, а выпустить первый токен через API нельзя.
  # Идемпотентна: повторный запуск не создаёт второго владельца, но выпускает новый токен.
  init:
    <<: *app-service
    command: python -m app.cli init
    profiles: ["tools"]

  # Поставляемые артефакты контракта: схема OpenAPI и справочник кодов ошибок.
  # Пишутся в смонтированный исходный каталог, поэтому появляются прямо в репозитории.
  # Базы команде не нужно: и схема, и справочник — свойства кода, а не установки.
  schema:
    <<: *app-service
    command: >-
      sh -c "python -m app.cli openapi --output openapi.json
      && python -m app.cli errors --output docs/ERRORS.md"
    depends_on: []
    profiles: ["tools"]

  # Демо-набор: очереди с разными процессами, задачи с историей, проект, доска и
  # включённое правило автоматики. Всё создаётся сценариями, поэтому наполнение
  # порождает события — воркер их разберёт, и у акторов появится непустой инбокс.
  #
  # Повторный запуск отказывает: набор — связный граф, доливать его нечем. Начать
  # заново — docker compose down -v.
  demo:
    <<: *app-service
    command: python -m app.cli demo
    profiles: ["tools"]

  # Чистка растущих журналов: очередь событий, журнал автоматики, журнал доставок.
  # Сроки хранения — в переменных TRACKER_RETENTION_*, удаление идёт пачками.
  #
  # Первый запуск на живой установке стоит делать без удаления:
  #   docker compose run --rm cleanup python -m app.cli cleanup --dry-run
  #
  # Команда доступна всегда и не зависит от того, включена ли чистка по расписанию у
  # планировщика (TRACKER_RETENTION_INTERVAL_HOURS, по умолчанию 0 — выключена).
  cleanup:
    <<: *app-service
    command: python -m app.cli cleanup
    profiles: ["tools"]

  test:
    <<: *app-service
    command: pytest
    profiles: ["tools"]

  lint:
    <<: *app-service
    command: sh -c "ruff check . && ruff format --check ."
    profiles: ["tools"]

volumes:
  pgdata:
