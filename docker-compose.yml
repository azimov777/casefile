# Контур разработки. Поднимается одной командой: docker compose up
#
# Сервисы migrate, test и lint спрятаны за профилем tools: они не должны стартовать
# вместе с сервером. Запускаются точечно: docker compose run --rm <сервис>.

name: tracker

# Что контур задаёт сам. Эти переменные приезжают в контейнер настоящим окружением и
# побеждают `.env`: адрес базы собирается из реквизитов сервиса `db`, и строка из чужого
# файла увела бы приложение мимо поднятой базы. Всё остальное приложение берёт из `.env`.
x-app-environment: &app-environment
  TRACKER_ENVIRONMENT: local
  TRACKER_DEBUG: "true"
  TRACKER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
  TRACKER_CORS_ORIGINS: ${TRACKER_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  # Единственная настройка, которую читают обе стороны: compose подставляет её в проброс
  # портов, а процесс MCP слушает то, что пришло в контейнер. Через `.env` в контейнер
  # она тоже попадает, но `.env` не участвует в `docker compose -p ... up` с портами из
  # командной строки: там значение видит только подстановка, и порт публикации уезжает,
  # а слушающий остаётся прежним. Поэтому она объявлена здесь той же подстановкой.
  TRACKER_MCP_PORT: ${TRACKER_MCP_PORT:-8100}
  # Адрес MCP снаружи, который API сообщает интерфейсу (`GET /api/v1/installation`), —
  # тот, что клиент агента кладёт в свою конфигурацию. Пусто — `localhost` на порту
  # строкой выше, и для этой машины это верно; задают его, когда MCP видят через прокси,
  # по TLS или с другой машины. Объявлен здесь, а не оставлен `.env`, по той же причине,
  # что и порт: иначе значение из командной строки не дошло бы до процесса API.
  TRACKER_MCP_PUBLIC_URL: ${TRACKER_MCP_PUBLIC_URL:-}
  # Хеш пароля владельца (`python -m app.cli password-hash`); пусто — пароля нет. Объявлен
  # так же, как в прод-контуре, где из этой подстановки выводится ещё и режим интерфейса.
  TRACKER_PASSWORD_HASH: ${TRACKER_PASSWORD_HASH:-}

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  image: tracker-dev:latest
  # `.env` объявлен здесь, а не найден приложением в смонтированном репозитории: точно
  # такой же блок стоит в прод-контуре, и оба получают из файла один и тот же набор
  # переменных. Читает файл compose на хосте — внутрь образа он не попадает.
  # `required: false` — без файла контур поднимается на значениях по умолчанию.
  env_file:
    - path: .env
      required: false
  environment: *app-environment
  # Контур разработки и есть работающая установка трекера: агенты ходят в MCP из любой
  # папки, а не только когда открыт этот репозиторий. Поэтому службы поднимаются вместе
  # с Docker и переживают перезагрузку машины. `unless-stopped`, а не `always`:
  # остановленное вручную (`docker compose stop`) остаётся остановленным.
  # Разовые сервисы профиля `tools` ниже перебивают это на `restart: "no"`.
  restart: unless-stopped
  volumes:
    # Исходники монтируются целиком: правка файла видна контейнеру сразу.
    #
    # Точка монтирования здесь ровно одна, и второй быть не должно. Рядом стоял анонимный
    # том `- /app/.venv`, прятавший виртуальное окружение хоста. Прятать ему нечего:
    # зависимости живут в окружении образа `/opt/venv` (`docker/Dockerfile.dev`), каталога
    # `/app/.venv` внутри контейнера не читает никто, а окружение хоста в путь импорта не
    # попадает — Python подхватывает `.venv` только тем, что из него запущен. Цена же у
    # тома настоящая: чтобы смонтировать том в `/app/.venv`, Docker обязан иметь там
    # каталог, и недостающий заводит сам — в источнике bind-mount, то есть прямо в
    # репозитории на хосте, а на Linux от root. Плюс новый анонимный том на каждое
    # пересоздание контейнера, и `docker compose down` их не убирает
    # (`docs/notes/docker.md`).
    - ./:/app
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    ports:
      # Порт наружу — чтобы смотреть базу клиентом с хоста; приложение ходит по сети compose.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app-service
    # `--timeout-graceful-shutdown` — последний рубеж, а не основной механизм: поток
    # ленты кончается сам по сигналу (`app/core/shutdown.py`), и ждать обычно нечего.
    # Без него остановка ждала бы **без срока**, а `--reload` при открытом потоке
    # вешал контур намертво (`docs/notes/docker.md`).
    #
    # `--reload-dir app` называет сторожу перезапуска ровно тот каталог, где живёт код
    # сервера. Без него uvicorn обходит весь рабочий каталог, то есть весь смонтированный
    # репозиторий, и на машине, где рядом с кодом лежит виртуальное окружение хоста,
    # обход дорожает вшестеро: 2.3 % одного ядра вхолостую против 13.7 % (замер задачи 53,
    # 180 файлов `*.py` против 1873). Заодно правка теста больше не перезапускает сервер:
    # сервер от неё не меняется, а каждый лишний перезапуск рвёт открытые потоки ленты.
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir app --timeout-graceful-shutdown 10
    ports:
      - "${TRACKER_PORT:-8000}:8000"
    # Больше срока uvicorn: за десять секунд он останавливается сам, и убивать его
    # Docker не должен — вместе с процессом оборвался бы и запрос, писавший в базу.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MCP-сервер для агентов: streamable HTTP на своём порту.
  #
  # Отдельный сервис, а не маршрут внутри API. Клиент MCP держит соединение открытым и
  # ждёт на нём: долгое ожидание ленты висит десятками секунд, и такие соединения нельзя
  # ставить в очередь к запросам фронтенда. Плюс агентов может быть десять при одном
  # фронтенде — масштабируется это отдельно.
  #
  # Автоперезапуска по изменению файлов у него нет: uvicorn перезапускает только себя.
  # После правки инструментов: docker compose restart mcp
  mcp:
    <<: *app-service
    command: python -m app.mcp
    # Порт с обеих сторон один: процесс MCP поднимает сервер сам и слушает
    # `TRACKER_MCP_PORT` из настроек. Правая половина проброса обязана двигаться вместе
    # с левой, иначе наружу публикуется порт, на котором внутри никто не слушает. Внутрь
    # контейнера то же значение приезжает окружением из `x-app-environment` — одной и той
    # же подстановкой, чтобы три места (проброс, процесс, проверка здоровья) двигались
    # разом.
    ports:
      - "${TRACKER_MCP_PORT:-8100}:${TRACKER_MCP_PORT:-8100}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:${TRACKER_MCP_PORT:-8100}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Вызов инструмента доводится до конца по сигналу остановки: он может писать в
    # базу, а оборванная посреди работы транзакция хуже лишних секунд ожидания.
    # Больше `GRACEFUL_SHUTDOWN_TIMEOUT` из `app/mcp/__main__.py` (20 с): процесс
    # останавливается сам, и до `SIGKILL` дело не доходит.
    stop_grace_period: 30s

  # Миграции — явный шаг, а не часть старта приложения: несколько реплик, применяющих
  # миграции одновременно, дают гонку и испорченную схему.
  migrate:
    <<: *app-service
    command: alembic upgrade head
    restart: "no"
    profiles: ["tools"]

  # Первичная настройка установки: участник-владелец и его первый токен набора `main`.
  # Без неё API заперт — каждый маршрут `/api/v1` требует токена, а выпустить первый токен
  # через API нельзя. Срабатывает только на пустой установке: если токен уже есть, команда
  # ничего не создаёт и говорит об этом, поэтому её безопасно держать рядом с миграциями.
  init:
    <<: *app-service
    command: python -m app.cli init
    restart: "no"
    profiles: ["tools"]

  # Ключ интерфейса локальной установки: действующий токен набора `main` владельца в файле
  # `.secrets/ui-token`, откуда его берёт контур интерфейса (`ui/`). Набор `main` — решение
  # владельца (`docs/DEVELOPMENT.md`, «Ключ для локального интерфейса»). Секрет в
  # вывод не попадает — вывод этой команды уезжает в журнал подъёма контура.
  #
  # Идемпотентна по файлу, а не по базе: секрет выпущенного токена не восстановить, в
  # базе лежит только хеш. Повторный запуск видит в файле годный ключ и не выпускает
  # ничего; потерянный файл даёт новый ключ, а прежний токен с тем же именем отзывается
  # тем же действием — иначе на машине копились бы действующие секреты, которых никто
  # не знает. Годный ключ другого набора заменяется так же, с отзывом прежнего. Сам сервис
  # за профилем `tools` при подъёме не идёт: ключ меняется только его запуском руками.
  #
  # Каталог `.secrets/` виден только этой машине: он в `.gitignore` и в `.dockerignore`.
  #
  # Написанное сервис возвращает хозяину репозитория. Дев-образ непривилегированного
  # пользователя не заводит, и команда работает от root; на Linux владелец файла в
  # смонтированном каталоге — тот же root, а права секрета `0600`. Хозяин установки получает
  # собственный каталог, из которого не может ни прочитать ключ (`cat .secrets/ui-token` из
  # README отвечает `Permission denied`), ни удалить его. На macOS этого не видно вовсе:
  # слой обмена файлами Docker Desktop владельца подменяет (`docs/notes/docker.md`).
  #
  # Владелец берётся у самого смонтированного каталога (`stat -c %u:%g /app`), а не у
  # переменной. Умолчание переменной годилось бы не всякой машине: `1000:1000` подходит
  # той, где владелец установки завёлся первым, а на прочих команда упиралась бы в отказ
  # вместо файла, и «контур поднимается одной командой без подготовки» перестал бы быть
  # правдой. Root же знает верный ответ в момент запуска и ничего не спрашивает.
  # Прод-контуру эта забота не нужна вовсе: ключи там живут в именованных томах и на хост
  # не выходят (`docker-compose.prod.yml`).
  local-token:
    <<: *app-service
    command: >-
      sh -c "python -m app.cli local-token --output .secrets/ui-token
      && chown -R $$(stat -c %u:%g /app) .secrets"
    restart: "no"
    profiles: ["tools"]

  # Токен агента этой машины: действующий токен набора `main` участника `agent` в файле
  # `.secrets/agent-token`, откуда его берёт тот, кто подключает агента к MCP. Устроен
  # как `local-token` выше — идемпотентен по файлу, секрет не печатает, файл возвращает
  # хозяину репозитория. Порядок с `local-token` не важен: пришедшая первой команда
  # заводит на пустой установке владельца-человека.
  agent-token:
    <<: *app-service
    command: >-
      sh -c "python -m app.cli agent-token --output .secrets/agent-token
      && chown -R $$(stat -c %u:%g /app) .secrets"
    restart: "no"
    profiles: ["tools"]

  # Демонстрационные данные: очередь DEMO, задачи во всех шести статусах, дела с
  # записями всех типов, связи всех трёх видов. Нужны фронтенду и назначателю, чтобы
  # каждый экран было чем наполнить, и живой проверке MCP, которой нужна задача в очереди.
  # Идемпотентна: повторный запуск видит очередь DEMO и ничего не делает.
  # В прод-контуре такого сервиса нет намеренно — демо-данные в рабочей установке мусор.
  demo:
    <<: *app-service
    command: python -m app.cli demo
    restart: "no"
    profiles: ["tools"]

  # Поставляемые артефакты контракта: схема OpenAPI и справочник кодов ошибок.
  # Пишутся в смонтированный исходный каталог, поэтому появляются прямо в репозитории.
  # Базы команде не нужно: и схема, и справочник — свойства кода, а не установки.
  #
  # Владелец возвращается той же строкой, что у `local-token`, и по той же причине. Обычному
  # прогону она не нужна: оба файла закоммичены, в клоне они уже есть, а запись идёт
  # усечением на месте — inode прежний, значит, и владелец прежний. Нужна она ровно тогда,
  # когда файла нет: удалённый и собранный заново артефакт root создаёт своим, и правка его
  # хозяином упирается в отказ.
  schema:
    <<: *app-service
    command: >-
      sh -c "python -m app.cli openapi --output openapi.json
      && python -m app.cli errors --output docs/ERRORS.md
      && chown $$(stat -c %u:%g /app) openapi.json docs/ERRORS.md"
    depends_on: []
    restart: "no"
    profiles: ["tools"]

  # Адрес тестовой базы отдельной переменной не задаётся: по умолчанию это основная
  # база с суффиксом `_test` (`Settings.effective_test_database_url`). Строка в
  # окружении сервиса победила бы `.env`, где владелец вправе указать свою.
  test:
    <<: *app-service
    command: pytest
    restart: "no"
    profiles: ["tools"]

  lint:
    <<: *app-service
    command: sh -c "ruff check . && ruff format --check ."
    restart: "no"
    profiles: ["tools"]

  # Lock-файл зависимостей `uv.lock`: `uv lock` над смонтированным репозиторием, базы не
  # нужно. Всё, что написано после имени сервиса, уходит аргументами в `uv lock`, поэтому
  # команда объявлена `entrypoint`, а не `command` — `command` заменился бы целиком:
  #   docker compose run --rm lock              # свести lock-файл с правкой pyproject.toml
  #   docker compose run --rm lock --upgrade    # поднять все зависимости до свежих версий
  # Владелец возвращается той же строкой и по той же причине, что у `schema`: имеющийся
  # файл uv переписывает на месте, а заново созданный достался бы root.
  lock:
    <<: *app-service
    entrypoint:
      - sh
      - -c
      - uv lock "$$@" && chown $$(stat -c %u:%g /app) uv.lock
      - lock
    depends_on: []
    restart: "no"
    profiles: ["tools"]

volumes:
  pgdata:
