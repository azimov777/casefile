# Образы для установок, для amd64 и arm64: `ghcr.io/<владелец>/casefile` и
# `ghcr.io/<владелец>/casefile-ui`. Их берёт `docker-compose.prod.yml`.
#
# Новая версия для установок — только выпуск с git-тегом. Пуш тега `vX.Y.Z` публикует
# образы под номером версии без `v` (`v0.2.0` → `0.2.0`, `type=semver`) и под подвижным
# тегом канала выпусков `stable`. На `stable` по умолчанию стоит каждая установка, и её
# служба `updater` раз в час сверяет именно его. Пре-релиз (`v0.3.0-rc.1`) получает только
# свой номер: `stable` он не двигает.
#
# Каждый коммит main после зелёных проверок публикуется под `latest` и `sha-<коммит>` —
# для разработки и для тех, кто сам закрепил установку на `latest`; установки на
# умолчаниях его не видят. `flavor: latest=false` — чтобы `latest` не двигал и тег
# выпуска: у `docker/metadata-action` по умолчанию `type=semver` добавляет `latest` сам.
#
# Выпуск публикуется так: сначала `git push origin vX.Y.Z` и дождаться образов, потом
# main. В обратном порядке обновлятор прежних установок (до TRK-119 он брал compose-файл с
# main) успел бы взять файл, который зовёт `stable`, раньше, чем `stable` появится.
#
# Скил Casefile идёт тем же каналом: ветку `stable` перематывает на коммит тега выпуска джоб
# `channel` — в запуске на push `main`, когда коммит уже в репозитории (TRK-445), и только
# если у тега выпуска зелёный запуск этого workflow. Маркетплейс плагина и `npx skills`
# смотрят на git-ref `stable`; ветка двигается только вперёд, без переписывания истории, и
# только после публикации образов — скил не приходит к агентам раньше сервера (TRK-398#8).
# Тем же джобом, следом за `stable`, ветка `plugin` получает коммит выпуска с одними файлами
# плагина (`.claude-plugin/`, `.codex-plugin/`, `skills/`, LICENSE, README): её отслеживает
# портал Anthropic, а в пределы его сканера весь репозиторий не входит (TRK-478).
#
# Проверки — вызовом `ci.yml`, а не параллельным workflow: публикация обязана ждать их
# исхода, иначе красный выпуск разъехался бы по всем установкам.
#
# Метку `org.opencontainers.image.version` ставит `docker/metadata-action`; по ней
# обновлятор установки пишет в лог, на какой выпуск перешёл и на какой вернуться.
#
# Пакеты ghcr.io, опубликованные впервые, приватны: один раз после первого прогона их
# делают публичными в настройках пакета на GitHub, иначе установщик без входа в реестр
# ничего не скачает.

name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит отменяет публикацию предыдущего: `latest` всё равно станет последним. У тега
# своя группа: выпуск не отменяется коммитом main.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: casefile
            context: .
            file: docker/Dockerfile.prod
          - image: casefile-ui
            context: ui
            file: ui/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Вторая архитектура собирается под эмуляцией. У интерфейса под ней идёт только
      # стадия nginx: сборщик статики работает на платформе раннера (`ui/docker/Dockerfile`).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Канал скила: ветка `stable` на коммит выпуска. Идёт в запуске на push `main`, а не на
  # тег: выпуск пушит тег раньше `main` (см. выше), и из запуска тега пуш коммита выпуска,
  # менявшего `.github/workflows`, GitHub отклоняет — у GITHUB_TOKEN нет права `workflows`
  # (TRK-445). К push `main` коммит уже в репозитории, стоит ли на нём тег выпуска без `-`,
  # видно по тегам. «Только после образов» держит не `needs`, а сверка: у тега должен быть
  # зелёный запуск этого workflow, иначе `stable` не двигается (TRK-398#8). Checkout полный,
  # иначе раннер не видит прежней вершины `stable` и пуш отклоняется «fetch first». Пуш без
  # `--force`; `stable` не предок коммита — джоб падает, историю не переписывает. Ветки нет —
  # пуш её создаёт.
  channel:
    name: Move stable branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward stable to the release commit
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          tag=$(git tag --points-at "$SHA" --list 'v*' | grep -v '[-]' | sort -V | tail -n 1 || true)
          if [ -z "$tag" ]; then
            echo "No release tag on $SHA: stable stays where it is."
            exit 0
          fi
          ok=$(gh run list --workflow images.yml --branch "$tag" --commit "$SHA" \
            --status success --json databaseId --jq length)
          if [ "$ok" -lt 1 ]; then
            echo "::error::Images run for $tag has not succeeded: stable is not moved."
            exit 1
          fi
          if git rev-parse --verify --quiet refs/remotes/origin/stable >/dev/null; then
            git merge-base --is-ancestor refs/remotes/origin/stable "$SHA" || {
              echo "::error::origin/stable is not an ancestor of $SHA: not a fast-forward."
              exit 1
            }
          fi
          git push origin "$SHA:refs/heads/stable"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Узкая ветка `plugin` (TRK-478): только файлы плагина, по коммиту на выпуск. Идёт
      # там же и после `stable`, на тот же тег: без тега или при красных образах шаг выше
      # выходит или падает и этот не запускается. Коммит строит `scripts/build-plugin-branch.sh`,
      # пуш без `--force`: родитель — вершина `origin/plugin`, ветки нет — пуш её создаёт.
      - name: Add the plugin files of the release to the plugin branch
        if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          parent=""
          if git rev-parse --verify --quiet refs/remotes/origin/plugin >/dev/null; then
            parent="--parent refs/remotes/origin/plugin"
          fi
          commit=$(scripts/build-plugin-branch.sh --commit "$TAG" $parent "$RUNNER_TEMP/plugin" | tail -n 1)
          git push origin "$commit:refs/heads/plugin"
