# Образы для установок: каждый коммит main после зелёных проверок становится
# `ghcr.io/<владелец>/casefile` и `ghcr.io/<владелец>/casefile-ui` с тегами `latest` и
# `sha-<коммит>`, для amd64 и arm64. Их берёт `docker-compose.prod.yml`, а служба
# `updater` установки подтягивает `latest` на каждом старте Docker.
#
# Проверки — вызовом `ci.yml`, а не параллельным workflow: публикация обязана ждать их
# исхода, иначе красный коммит разъехался бы по всем установкам.
#
# Метку `org.opencontainers.image.source` ставит `docker/metadata-action`; по ней
# обновлятор установки находит и убирает висящие образы проекта — и только их.
#
# Пакеты ghcr.io, опубликованные впервые, приватны: один раз после первого прогона их
# делают публичными в настройках пакета на GitHub, иначе установщик без входа в реестр
# ничего не скачает.

name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит отменяет публикацию предыдущего: `latest` всё равно станет последним.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: casefile
            context: .
            file: docker/Dockerfile.prod
          - image: casefile-ui
            context: ui
            file: ui/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Вторая архитектура собирается под эмуляцией. У интерфейса под ней идёт только
      # стадия nginx: сборщик статики работает на платформе раннера (`ui/docker/Dockerfile`).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
