# Подпись вклада: каждый коммит запроса на слияние несёт `Signed-off-by` своего автора
# (`.github/DCO`, `CONTRIBUTING.md`).
#
# Отдельный конвейер, а не задание внутри `ci.yml`: тот вызывается ещё и из `images.yml`
# на каждый коммит main, где проверять нечего — там нет ни базы, ни головы запроса, а
# история до 12 сентября 2026 подписей не несёт вовсе.
#
# Проверку делает тот же скрипт, что доступен человеку до отправки PR
# (`scripts/check-dco.sh`): расхождение конвейера с локальной командой означало бы
# красноту, которую автор не может воспроизвести у себя.
#
# PR от Dependabot проходят без подписи — у бота нет своего адреса, которым он мог бы
# расписаться за код (`scripts/check-dco.sh`, `CONTRIBUTING.md`). Признак этого — не
# что-либо в коммите, а `github.event.pull_request.user.login` ниже: содержимым вклада
# его не подделать.

name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signed-off:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Полная история: скрипт идёт по диапазону от базы до головы, а мелкий чекаут
      # обрывает его на первом же коммите, которого нет в клоне.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check sign-off
        # Хеши и логин автора PR приезжают окружением, а не подстановкой в строку
        # команды: так содержимое события не может дописать к ней ничего своего.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
