# Публикует папку `site/` на GitHub Pages: сайт, поддержка, политика конфиденциальности и
# условия для полей листингов каталогов (TRK-462). Источник Pages в настройках репозитория —
# «GitHub Actions» (Settings → Pages → Source). Запускается только когда меняется `site/`.

name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
