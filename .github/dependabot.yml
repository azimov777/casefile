# Регулярное обновление зависимостей бэкенда. Версии закрепляет `uv.lock`, и образы
# ставят строго его (`docker/Dockerfile.*`), поэтому свежая версия приходит отдельным
# PR, а не посреди чужой сборки. Раз в неделю бот открывает PR с новыми версиями, и
# конвейер (`ci.yml`, событие `pull_request`) прогоняет на нём линтер и весь набор.
#
# Сливает человек, и только зелёное: автослияния нет намеренно. Слитый коммит main сразу
# собирается в образ `latest` и уезжает во все установки с автообновлением
# (`images.yml`), а сквозных тестов интерфейса в конвейере нет.
#
# То же обновление руками — `docker compose run --rm lock --upgrade`
# (`docs/DEVELOPMENT.md`, раздел «Зависимости»).

version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Бот правит только `uv.lock`. По умолчанию он поднимал бы нижние границы в
    # `pyproject.toml` до каждой новой версии, и манифест перестал бы говорить, с какой
    # версии проект работает: закреплять версии — дело lock-файла.
    versioning-strategy: lockfile-only
    # Транзитивные зависимости тоже: без этого бот следит только за названными в
    # `pyproject.toml`, а anyio, starlette и остальные застыли бы в lock-файле навсегда.
    # Набор в TRK-62 уронила именно транзитивная anyio.
    allow:
      - dependency-type: all
    # Мелкие и исправляющие выпуски — одним PR: один прогон набора и одно слияние в
    # неделю. Мажорный выпуск идёт своим PR, чтобы ломающее изменение не держало
    # остальные обновления.
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # uv, которым образы ставят зависимости из lock-файла: стадия `uv` в
  # `docker/Dockerfile.dev` и `docker/Dockerfile.prod`. Lock-файл в PR пишет uv самого
  # бота, и uv образов не должен от него отставать, иначе однажды не прочитает формат.
  # Базовый образ Python здесь не обновляется: смена его версии — отдельное решение.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    allow:
      - dependency-name: astral-sh/uv
    commit-message:
      prefix: build
      include: scope
